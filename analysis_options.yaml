include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_use_package_imports
    - avoid_print
    - directives_ordering
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
