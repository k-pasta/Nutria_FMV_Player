name: nutria_fmv_player
description: "Plays interactive movies (.fmv) made with Nutria FMV Maker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  media_kit: ^1.2.0
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.6
  file_picker: ^13.3.3
  window_manager: ^0.5.1
  shared_preferences: ^2.5.6
  material_ui: ^1.11.0
  path: ^1.9.0
  collection: ^1.19.1
  # The .fmv format, shared with Nutria FMV Maker (see CLAUDE.md for
  # working on both at once).
  nutria_fmv_protocol:
    git:
      url: https://github.com/k-pasta/Nutria_FMV_Maker.git
      path: packages/nutria_fmv_protocol
      ref: main
  # How screens are drawn, and the fonts they use: shared with the Maker's
  # designer, so a story looks the same in both.
  nutria_fmv_screens:
    git:
      url: https://github.com/k-pasta/Nutria_FMV_Maker.git
      path: packages/nutria_fmv_screens
      ref: main

# The screens package depends on the protocol from the same repository;
# this makes both use the same copy (pub would otherwise see two sources).
# A local pubspec_overrides.yaml (see CLAUDE.md) replaces this while working
# on both repositories.
dependency_overrides:
  nutria_fmv_protocol:
    git:
      url: https://github.com/k-pasta/Nutria_FMV_Maker.git
      path: packages/nutria_fmv_protocol
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
